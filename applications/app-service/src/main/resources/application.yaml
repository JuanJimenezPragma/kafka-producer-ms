##Spring Configuration
server:
  port: 8080
spring:
  application:
    name: kafka-producer-ms
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: /h2
  profiles:
    include:

reactive:
  commons:
    kafka:
      app:
        connection-properties:
          bootstrap-servers: localhost:9092
          security:
            protocol: PLAINTEXT
